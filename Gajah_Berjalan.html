<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gajah berjalan</title>
<style>
  :root{--night:#0f1626;--ink:#f3e9dc;--dim:#a9b0c3;--amber:#ffb457;--line:#2a3550}
  *{box-sizing:border-box}
  body{margin:0;background:#0a0f1c;color:var(--ink);font-family:"Gill Sans","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .app{width:min(980px,100%);border-radius:22px;overflow:hidden;background:var(--night);box-shadow:0 30px 70px -30px #000}
  .stage{position:relative;aspect-ratio:2/1;min-height:220px}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  h1{position:absolute;left:clamp(16px,3vw,34px);top:clamp(12px,2.4vw,28px);margin:0;font:italic 400 clamp(1.7rem,5vw,3.2rem)/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;color:#fff3df;text-shadow:0 2px 18px rgba(20,10,40,.55)}
  .status{position:absolute;right:clamp(12px,2.4vw,26px);top:clamp(14px,2.6vw,30px);background:rgba(15,22,38,.62);border:1px solid rgba(255,255,255,.18);padding:6px 14px;border-radius:99px;font-size:.9rem;backdrop-filter:blur(4px)}
  .bar{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 20px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:.92rem;border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
  button.main{background:var(--amber);border-color:var(--amber);color:#2a1a05}
  button:focus-visible,input:focus-visible{outline:3px solid #8fd3ff;outline-offset:2px}
  .tl{min-width:0}
  canvas{width:100%;height:58px;display:block}
  .cap{display:flex;justify-content:space-between;color:var(--dim);font-size:.75rem;margin-top:2px}
  .vol{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:.85rem}
  input[type=range]{accent-color:var(--amber);width:90px}
  @media(max-width:760px){.bar{grid-template-columns:1fr}.vol{justify-content:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gajah berjalan di savana saat senja">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#14213d"/><stop offset=".55" stop-color="#5b3a70"/><stop offset="1" stop-color="#f4a259"/></linearGradient></defs>
      <rect width="600" height="300" fill="url(#sky)"/>
      <g fill="#fff" opacity=".7"><circle cx="60" cy="40" r="1.4"/><circle cx="150" cy="22" r="1"/><circle cx="260" cy="48" r="1.3"/><circle cx="350" cy="18" r="1"/><circle cx="520" cy="36" r="1.4"/><circle cx="570" cy="80" r="1"/></g>
      <circle cx="450" cy="205" r="66" fill="#ffd27a"/>
      <path d="M0 236 L0 205 Q70 170 140 200 T290 195 T430 205 T600 188 L600 236Z" fill="#3b2a4a"/>
      <g fill="#1d1426"><rect x="78" y="168" width="5" height="70"/><ellipse cx="80" cy="166" rx="40" ry="11"/><rect x="528" y="182" width="4" height="56"/><ellipse cx="530" cy="181" rx="30" ry="8"/></g>
      <rect y="234" width="600" height="66" fill="#2a1b30"/>
      <ellipse id="shadow" cx="300" cy="239" rx="62" ry="6" fill="#000" opacity=".35"/>
      <g transform="translate(150 0)"><g id="el">
        <path d="M82 170 Q66 180 70 205" stroke="#8d9ba5" stroke-width="5" fill="none" stroke-linecap="round"/>
        <rect class="leg" x="96" y="190" width="22" height="46" rx="9" fill="#8d9ba5"/>
        <rect class="leg" x="170" y="190" width="22" height="46" rx="9" fill="#8d9ba5"/>
        <ellipse cx="150" cy="172" rx="76" ry="52" fill="#a9b6bf"/>
        <rect class="leg" x="120" y="190" width="24" height="48" rx="9" fill="#bac6ce"/>
        <rect class="leg" x="148" y="190" width="24" height="48" rx="9" fill="#bac6ce"/>
        <circle cx="210" cy="140" r="38" fill="#bac6ce"/>
        <ellipse id="ear" cx="190" cy="138" rx="22" ry="32" fill="#9aa9b3" style="transform-origin:200px 138px"/>
        <path id="trunk" d="M236 150 Q262 160 256 196 Q254 214 240 214" stroke="#bac6ce" stroke-width="17" fill="none" stroke-linecap="round" style="transform-origin:232px 148px"/>
        <path d="M232 164 Q248 168 252 156" stroke="#f4efe0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="222" cy="130" r="4" fill="#1b2330"/>
        <g id="waves" opacity="0" stroke="#ffe3b0" stroke-width="3" fill="none" stroke-linecap="round"><path d="M262 92 Q272 100 262 108"/><path d="M274 84 Q290 100 274 116"/></g>
      </g></g>
    </svg>
    <h1>Gajah berjalan</h1>
    <div class="status" id="status">Gajah sedang berjalan</div>
  </div>
  <div class="bar">
    <div class="btns">
      <button class="main" id="bSound">Aktifkan suara</button>
      <button id="bOnce">Putar sekali</button>
      <button id="bPause">Jeda</button>
    </div>
    <div class="tl"><canvas id="graph" aria-label="Grafik posisi gajah"></canvas>
      <div class="cap"><span>0 dtk</span><span>posisi gajah sepanjang animasi</span><span id="dEnd">35 dtk</span></div></div>
    <label class="vol">Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></label>
  </div>
</div>
<script>
const T0=3.5, D=35, R=430;   // T0: detik sebelum audio mulai (gajah jalan masuk), D: durasi siklus
// waktu tiap terompet di audio asli (detik)
const CALLS=[[0.4,3.1],[4.2,6.3],[6.9,8.6],[10.9,13.5],[14.7,16.8],[17.4,19.1],[21.2,23.9],[25.0,27.1],[27.7,28.4]].map(c=>[c[0]+T0,c[1]+T0]);
const POS=CALLS.map((_,i)=>-70+i*17.5);   // gajah maju sedikit tiap selesai menerompet
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
document.getElementById('dEnd').textContent=D+' dtk';

function pose(t){
  let x,trunk=0,ear=0,wave=0,phase='jalan',inCall=-1;
  CALLS.forEach((c,i)=>{ if(t>=c[0]&&t<c[1]) inCall=i; });
  if(inCall>=0){
    const [a,b]=CALLS[inCall], up=clamp((t-a)/.25,0,1), down=clamp((b-t)/.25,0,1), k=Math.min(up,down);
    x=POS[inCall]; trunk=-60*ease(k); ear=Math.sin(t*22)*12*k; wave=k>.6?1:0; phase='terompet';
  }else if(t<CALLS[0][0]){ const k=t/CALLS[0][0]; x=-R+(POS[0]+R)*(1-(1-k)*(1-k)); }
  else if(t>=CALLS[CALLS.length-1][1]){ const e=CALLS[CALLS.length-1][1],k=(t-e)/(D-e); x=POS[POS.length-1]+(R-POS[POS.length-1])*k*k; phase='pergi'; }
  else{ let i=0; while(t>=CALLS[i+1][0]) i++; const a=CALLS[i][1],b=CALLS[i+1][0]; x=POS[i]+(POS[i+1]-POS[i])*ease((t-a)/(b-a)); }
  // jarak ke terompet terdekat -> kaki hanya melangkah saat tidak menerompet
  let dist=0; if(inCall<0) dist=Math.min(...CALLS.map(c=>t<c[0]?c[0]-t:t-c[1]));
  const w=clamp(dist/.2,0,1), swing=Math.sin(t*10)*14*w, y=-Math.abs(Math.sin(t*10))*3*w;
  if(inCall<0) ear=Math.sin(t*5)*6*w;
  return {x,y,trunk,ear,swing,wave,phase};
}
const el=document.getElementById('el'),trunkEl=document.getElementById('trunk'),earEl=document.getElementById('ear'),
  waves=document.getElementById('waves'),shadow=document.getElementById('shadow'),legs=[...document.querySelectorAll('.leg')];
function draw(t){
  const p=pose(t);
  el.setAttribute('transform',`translate(${p.x} ${p.y})`);
  trunkEl.style.transform=`rotate(${p.trunk}deg)`; earEl.style.transform=`rotate(${p.ear}deg)`;
  waves.setAttribute('opacity',p.wave); shadow.setAttribute('cx',300+p.x);
  legs.forEach((l,i)=>{ l.style.transformOrigin=`${+l.getAttribute('x')+11}px 192px`; l.style.transform=`rotate(${(i%2?-1:1)*p.swing}deg)`; });
  return p.phase;
}

let soundOn=false;
function syncAudio(){
  const at=t-T0, should=soundOn&&playing&&at>=0&&at<(audio.duration||28.9)-0.05;
  if(should){
    if(audio.paused){ audio.currentTime=at; audio.play().catch(()=>{}); }
    else if(Math.abs(audio.currentTime-at)>.35) audio.currentTime=at;
  }else if(!audio.paused) audio.pause();
}

/* ---------- GRAFIK ---------- */
const cv=document.getElementById('graph'),c2=cv.getContext('2d');
function drawGraph(t){
  const r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*r)){cv.width=Math.round(w*r);cv.height=Math.round(h*r);}
  c2.setTransform(r,0,0,r,0,0); c2.clearRect(0,0,w,h);
  const X=s=>s/D*(w-4)+2,Y=a=>h-5-((a+R)/(2*R))*(h-10);
  c2.fillStyle='rgba(143,211,255,.22)'; CALLS.forEach(c=>c2.fillRect(X(c[0]),0,X(c[1])-X(c[0]),h));
  c2.beginPath(); for(let s=0;s<=D;s+=.05){s?c2.lineTo(X(s),Y(pose(s).x)):c2.moveTo(X(s),Y(pose(s).x));} c2.strokeStyle='#ffb457'; c2.lineWidth=2; c2.stroke();
  c2.beginPath(); c2.moveTo(X(t),0); c2.lineTo(X(t),h); c2.strokeStyle='#fff'; c2.lineWidth=2; c2.stroke();
}

/* ---------- LOOP ---------- */
let t=0,last=null,playing=true,once=false;
const statusEl=document.getElementById('status'),labels={jalan:'Gajah sedang berjalan',terompet:'Gajah menerompet!',pergi:'Gajah berjalan pergi'};
function frame(ts){
  if(last===null)last=ts; const dt=Math.min((ts-last)/1000,.1); last=ts;
  if(playing){ t+=dt;
    if(t>=D){ if(once){t=0;playing=false;once=false;document.getElementById('bPause').textContent='Lanjut';statusEl.textContent='Selesai. Tekan Putar sekali untuk mengulang';} else t-=D; } }
  syncAudio();
  const ph=draw(t); drawGraph(t); if(playing)statusEl.textContent=labels[ph];
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.getElementById('bSound').onclick=e=>{
  soundOn=!soundOn; e.target.textContent=soundOn?'Matikan suara':'Aktifkan suara';
  audio.volume=+document.getElementById('vol').value;
  if(soundOn){
    // kalau animasi belum/sudah lewat bagian bersuara, lompat ke awal suara supaya langsung bunyi
    if(t<T0||t>T0+28.3){ t=T0; }
    playing=true; document.getElementById('bPause').textContent='Jeda';
    audio.currentTime=Math.max(0,t-T0); audio.play().catch(()=>{ statusEl.textContent='Browser memblokir suara. Coba klik lagi.'; });
  }else audio.pause();
};
audio.addEventListener('error',()=>{ statusEl.textContent='Suara gagal dimuat. Buka file ini langsung di browser.'; });
document.getElementById('vol').oninput=e=>{ audio.volume=+e.target.value; };
document.getElementById('bOnce').onclick=()=>{ t=0;once=true;playing=true;audio.pause();document.getElementById('bPause').textContent='Jeda'; };
document.getElementById('bPause').onclick=e=>{ playing=!playing; e.target.textContent=playing?'Jeda':'Lanjut'; if(!playing)statusEl.textContent='Dijeda'; };
addEventListener('resize',()=>drawGraph(t));
</script>
